<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 - 温暖米黄 -->
  <rect width="200" height="150" fill="#fff9f0"/>

  <!-- 柔和渐变背景 -->
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff5e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe8cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#warmGradient)" opacity="0.5"/>

  <!-- 顶部导航 -->
  <rect y="0" width="200" height="24" fill="rgba(255, 250, 240, 0.95)" stroke="rgba(185, 131, 45, 0.2)" stroke-width="0.5"/>

  <!-- 侧边栏 - 温暖色调 -->
  <rect x="8" y="32" width="50" height="110" fill="rgba(255, 248, 235, 0.9)" stroke="rgba(185, 131, 45, 0.15)" stroke-width="0.5" rx="5"/>

  <!-- 主内容卡片 - 柔和投影 -->
  <g filter="url(#warmShadow)">
    <rect x="66" y="32" width="96" height="36" fill="rgba(255, 252, 245, 0.95)" stroke="rgba(185, 131, 45, 0.2)" stroke-width="0.5" rx="5"/>
    <rect x="66" y="74" width="96" height="36" fill="rgba(255, 252, 245, 0.95)" stroke="rgba(185, 131, 45, 0.2)" stroke-width="0.5" rx="5"/>
  </g>

  <defs>
    <filter id="warmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 温暖色调强调点 -->
  <circle cx="74" cy="44" r="4" fill="#b9832d"/>
  <circle cx="74" cy="86" r="4" fill="#d4a259"/>

  <!-- 文本线 -->
  <rect x="82" y="42" width="60" height="2" fill="rgba(139, 92, 26, 0.8)" rx="1"/>
  <rect x="82" y="48" width="40" height="2" fill="rgba(139, 92, 26, 0.5)" rx="1"/>
  <rect x="82" y="84" width="60" height="2" fill="rgba(139, 92, 26, 0.8)" rx="1"/>
  <rect x="82" y="90" width="40" height="2" fill="rgba(139, 92, 26, 0.5)" rx="1"/>

  <!-- 装饰元素 - 柔和圆形 -->
  <circle cx="24" cy="50" r="2" fill="#f5d799" opacity="0.6"/>
  <circle cx="32" cy="64" r="2" fill="#f5d799" opacity="0.6"/>
  <circle cx="40" cy="78" r="2" fill="#f5d799" opacity="0.6"/>

  <!-- 标签 -->
  <text x="100" y="132" fill="#b9832d" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle" font-weight="500">温馨柔和</text>
</svg>
