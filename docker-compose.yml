# 哪吒家庭 - 开发环境 Docker Compose 配置
# 用途：本地开发和测试
# 启动：docker-compose up -d
# 停止：docker-compose down

services:
    # PostgreSQL 数据库
    postgres:
        image: postgres:16-alpine
        container_name: nezha-postgres-dev
        environment:
            POSTGRES_DB: nezha_family
            POSTGRES_USER: nezha_user
            POSTGRES_PASSWORD: nezha_dev_password
            POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
        ports:
            - "127.0.0.1:5432:5432"
        networks:
            - nezha-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U nezha_user -d nezha_family"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    # Redis 缓存和任务队列
    redis:
        image: redis:7-alpine
        container_name: nezha-redis-dev
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-nezha_redis_password}
        volumes:
            - redis_data:/data
        ports:
            - "127.0.0.1:6379:6379"
        networks:
            - nezha-network
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nezha_redis_password}", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    # FastAPI 后端服务
    migrate:
        build:
            context: ./backend
            dockerfile: ../docker/Dockerfile.backend
            target: development
        container_name: nezha-migrate-dev
        environment:
            DATABASE_URL: postgresql+asyncpg://nezha_user:nezha_dev_password@postgres:5432/nezha_family
            SECRET_KEY: dev_secret_key_change_in_production
            ALGORITHM: HS256
            DEBUG: "true"
            ENVIRONMENT: development
        volumes:
            - ./backend:/app
        networks:
            - nezha-network
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"
        command: alembic upgrade head

    # 初始化可写存储卷权限，避免 named volume 默认 root:root 导致上传 500
    storage-permissions:
        image: alpine:3.20
        container_name: nezha-storage-permissions-dev
        user: "0:0"
        volumes:
            - media_files:/app/media
            - backup_files:/app/backups
            - ./backend/logs:/app/logs
        restart: "no"
        command: >
            sh -c "mkdir -p /app/media /app/backups /app/logs &&
            chown -R 1000:1000 /app/media /app/backups /app/logs &&
            chmod -R u+rwX,g+rwX /app/media /app/backups /app/logs"

    backend:
        build:
            context: ./backend
            dockerfile: ../docker/Dockerfile.backend
            target: development
        container_name: nezha-backend-dev
        environment:
            # 数据库配置
            DATABASE_URL: postgresql+asyncpg://nezha_user:nezha_dev_password@postgres:5432/nezha_family
            # Redis 配置
            REDIS_URL: redis://:${REDIS_PASSWORD:-nezha_redis_password}@redis:6379/0
            # JWT 配置
            SECRET_KEY: dev_secret_key_change_in_production
            AI_KEY_ENCRYPTION_SECRET: ${AI_KEY_ENCRYPTION_SECRET:-dev_ai_key_encryption_secret}
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: 10080
            # 应用配置
            DEBUG: "true"
            ENVIRONMENT: development
            TRUSTED_PROXY_COUNT: "1"
            ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
            # 文件存储配置
            MEDIA_ROOT: /app/media
            MAX_UPLOAD_SIZE: 104857600
            # AI 管家配置（默认关闭，可在后台管理页启用）
            AI_API_KEY: ${AI_API_KEY:-}
            AI_DEFAULT_BASE_URL: ${AI_DEFAULT_BASE_URL:-https://api.openai.com/v1}
            AI_DEFAULT_TEXT_MODEL: ${AI_DEFAULT_TEXT_MODEL:-gpt-4o-mini}
            AI_DEFAULT_VISION_MODEL: ${AI_DEFAULT_VISION_MODEL:-}
            AI_ENABLED: ${AI_ENABLED:-false}
            AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
            AI_FAILURE_THRESHOLD: ${AI_FAILURE_THRESHOLD:-3}
            # Celery 配置
            CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-nezha_redis_password}@redis:6379/1
            CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-nezha_redis_password}@redis:6379/2
            CELERY_TASK_TIME_LIMIT: 600
            CELERY_TASK_SOFT_TIME_LIMIT: 540
            CELERY_WORKER_PREFETCH_MULTIPLIER: 1
            CELERY_IMAGE_TASK_TIME_LIMIT: 600
            CELERY_IMAGE_TASK_SOFT_TIME_LIMIT: 540
            CELERY_AI_TASK_TIME_LIMIT: 180
            CELERY_AI_TASK_SOFT_TIME_LIMIT: 150
            CELERY_MEDIA_CLEANUP_TASK_TIME_LIMIT: 3600
            CELERY_MEDIA_CLEANUP_TASK_SOFT_TIME_LIMIT: 3300
        volumes:
            - ./backend:/app
            - media_files:/app/media
            - backup_files:/app/backups
            - ./backend/logs:/app/logs
        ports:
            - "8000:8000"
        networks:
            - nezha-network
        depends_on:
            migrate:
                condition: service_completed_successfully
            storage-permissions:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        restart: unless-stopped
        command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    # Celery Worker (异步任务处理)
    celery-worker:
        build:
            context: ./backend
            dockerfile: ../docker/Dockerfile.backend
            target: development
        container_name: nezha-celery-worker-dev
        environment:
            DATABASE_URL: postgresql+asyncpg://nezha_user:nezha_dev_password@postgres:5432/nezha_family
            REDIS_URL: redis://:${REDIS_PASSWORD:-nezha_redis_password}@redis:6379/0
            SECRET_KEY: dev_secret_key_change_in_production
            AI_KEY_ENCRYPTION_SECRET: ${AI_KEY_ENCRYPTION_SECRET:-dev_ai_key_encryption_secret}
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: 10080
            CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-nezha_redis_password}@redis:6379/1
            CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-nezha_redis_password}@redis:6379/2
            MEDIA_ROOT: /app/media
            DEBUG: "true"
            ENVIRONMENT: development
            TRUSTED_PROXY_COUNT: "1"
            AI_API_KEY: ${AI_API_KEY:-}
            AI_DEFAULT_BASE_URL: ${AI_DEFAULT_BASE_URL:-https://api.openai.com/v1}
            AI_DEFAULT_TEXT_MODEL: ${AI_DEFAULT_TEXT_MODEL:-gpt-4o-mini}
            AI_DEFAULT_VISION_MODEL: ${AI_DEFAULT_VISION_MODEL:-}
            AI_ENABLED: ${AI_ENABLED:-false}
            AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
            AI_FAILURE_THRESHOLD: ${AI_FAILURE_THRESHOLD:-3}
            CELERY_TASK_TIME_LIMIT: 600
            CELERY_TASK_SOFT_TIME_LIMIT: 540
            CELERY_WORKER_PREFETCH_MULTIPLIER: 1
            CELERY_IMAGE_TASK_TIME_LIMIT: 600
            CELERY_IMAGE_TASK_SOFT_TIME_LIMIT: 540
            CELERY_AI_TASK_TIME_LIMIT: 180
            CELERY_AI_TASK_SOFT_TIME_LIMIT: 150
            CELERY_MEDIA_CLEANUP_TASK_TIME_LIMIT: 3600
            CELERY_MEDIA_CLEANUP_TASK_SOFT_TIME_LIMIT: 3300
        volumes:
            - ./backend:/app
            - media_files:/app/media
            - ./backend/logs:/app/logs
        networks:
            - nezha-network
        depends_on:
            migrate:
                condition: service_completed_successfully
            storage-permissions:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        restart: unless-stopped
        command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

    # Vue 3 前端开发服务器
    frontend:
        build:
            context: ./frontend
            dockerfile: ../docker/Dockerfile.frontend
            target: development
        container_name: nezha-frontend-dev
        environment:
            VITE_API_BASE_URL: http://localhost:8080/api/v1
            VITE_APP_TITLE: 哪吒家庭
        volumes:
            - ./frontend:/app
            - /app/node_modules
        ports:
            - "3000:3000"
        networks:
            - nezha-network
        depends_on:
            - backend
        restart: unless-stopped
        command: npm run dev -- --host 0.0.0.0 --port 3000

    # Caddy 反向代理 (自动 HTTPS)
    caddy:
        image: caddy:2.7-alpine
        container_name: nezha-caddy-dev
        ports:
            - "8080:80"
            - "8443:443"
        volumes:
            - ./docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - nezha-network
        depends_on:
            - backend
            - frontend
        restart: unless-stopped

# 数据卷定义
volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
    media_files:
        driver: local
    backup_files:
        driver: local
    caddy_data:
        driver: local
    caddy_config:
        driver: local

# 网络定义
networks:
    nezha-network:
        driver: bridge
