<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 - 典雅米白 -->
  <rect width="200" height="150" fill="#fefdfb"/>

  <!-- 顶部导航栏 -->
  <rect y="0" width="200" height="24" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5"/>

  <!-- 侧边栏 -->
  <rect x="8" y="32" width="50" height="110" fill="#f8f7f5" stroke="rgba(0, 0, 0, 0.08)" stroke-width="0.5" rx="3"/>

  <!-- 主内容区 - 经典两栏卡片 -->
  <rect x="66" y="32" width="60" height="52" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="3"/>
  <rect x="134" y="32" width="60" height="52" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="3"/>
  <rect x="66" y="90" width="60" height="52" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="3"/>
  <rect x="134" y="90" width="60" height="52" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="3"/>

  <!-- 经典蓝色强调 -->
  <circle cx="74" cy="44" r="3" fill="#4a5568"/>
  <circle cx="142" cy="44" r="3" fill="#2c5282"/>

  <!-- 文本线条 -->
  <rect x="82" y="42" width="36" height="2" fill="rgba(0, 0, 0, 0.7)" rx="1"/>
  <rect x="82" y="48" width="28" height="1.5" fill="rgba(0, 0, 0, 0.5)" rx="0.75"/>
  <rect x="150" y="42" width="36" height="2" fill="rgba(0, 0, 0, 0.7)" rx="1"/>
  <rect x="150" y="48" width="28" height="1.5" fill="rgba(0, 0, 0, 0.5)" rx="0.75"/>

  <!-- 标签：经典 -->
  <text x="100" y="132" fill="#4a5568" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">经典布局</text>
</svg>
