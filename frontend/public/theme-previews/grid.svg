<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="200" height="150" fill="#f9f9f7"/>

  <!-- 顶部导航 -->
  <rect y="0" width="200" height="20" fill="#ffffff" stroke="rgba(0, 0, 0, 0.08)" stroke-width="0.5"/>

  <!-- 网格布局 - 3列2行 -->
  <rect x="8" y="28" width="56" height="52" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>
  <rect x="72" y="28" width="56" height="52" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>
  <rect x="136" y="28" width="56" height="52" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>

  <rect x="8" y="88" width="56" height="52" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>
  <rect x="72" y="88" width="56" height="52" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>
  <rect x="136" y="88" width="56" height="52" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>

  <!-- 图片区域模拟 -->
  <rect x="12" y="32" width="48" height="32" fill="#e8e8e5" rx="3"/>
  <rect x="76" y="32" width="48" height="32" fill="#e8e8e5" rx="3"/>
  <rect x="140" y="32" width="48" height="32" fill="#e8e8e5" rx="3"/>

  <!-- 强调色点 -->
  <circle cx="36" cy="48" r="6" fill="#c9432f" opacity="0.9"/>
  <circle cx="100" cy="48" r="6" fill="#2d6c68" opacity="0.9"/>
  <circle cx="164" cy="48" r="6" fill="#425184" opacity="0.9"/>

  <!-- 文本线 -->
  <rect x="12" y="70" width="36" height="1.5" fill="rgba(0, 0, 0, 0.6)" rx="0.75"/>
  <rect x="12" y="75" width="24" height="1.5" fill="rgba(0, 0, 0, 0.4)" rx="0.75"/>
  <rect x="76" y="70" width="36" height="1.5" fill="rgba(0, 0, 0, 0.6)" rx="0.75"/>
  <rect x="76" y="75" width="24" height="1.5" fill="rgba(0, 0, 0, 0.4)" rx="0.75"/>

  <!-- 标签 -->
  <text x="100" y="12" fill="#425184" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">网格视图</text>
</svg>
