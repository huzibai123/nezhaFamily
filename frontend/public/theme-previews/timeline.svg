<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="200" height="150" fill="#fafaf8"/>

  <!-- 顶部固定导航 -->
  <rect y="0" width="200" height="20" fill="#ffffff" stroke="rgba(0, 0, 0, 0.08)" stroke-width="0.5"/>

  <!-- 时间线中轴线 -->
  <line x1="100" y1="28" x2="100" y2="142" stroke="#e0e0dd" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 时间节点 -->
  <circle cx="100" cy="40" r="5" fill="#c9432f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="100" cy="70" r="5" fill="#2d6c68" stroke="#ffffff" stroke-width="2"/>
  <circle cx="100" cy="100" r="5" fill="#425184" stroke="#ffffff" stroke-width="2"/>
  <circle cx="100" cy="130" r="5" fill="#b9832d" stroke="#ffffff" stroke-width="2"/>

  <!-- 左侧内容卡片 -->
  <rect x="12" y="32" width="75" height="20" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>
  <rect x="12" y="92" width="75" height="20" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>

  <!-- 右侧内容卡片 -->
  <rect x="113" y="62" width="75" height="20" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>
  <rect x="113" y="122" width="75" height="20" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>

  <!-- 文本线条 -->
  <rect x="18" y="38" width="50" height="1.5" fill="rgba(0, 0, 0, 0.6)" rx="0.75"/>
  <rect x="18" y="43" width="35" height="1.5" fill="rgba(0, 0, 0, 0.4)" rx="0.75"/>
  <rect x="119" y="68" width="50" height="1.5" fill="rgba(0, 0, 0, 0.6)" rx="0.75"/>
  <rect x="119" y="73" width="35" height="1.5" fill="rgba(0, 0, 0, 0.4)" rx="0.75"/>

  <!-- 标签 -->
  <text x="100" y="12" fill="#2d6c68" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">时间线</text>
</svg>
