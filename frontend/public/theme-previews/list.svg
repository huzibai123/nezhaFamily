<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="200" height="150" fill="#fcfcfa"/>

  <!-- 顶部导航 -->
  <rect y="0" width="200" height="22" fill="#ffffff" stroke="rgba(0, 0, 0, 0.08)" stroke-width="0.5"/>

  <!-- 列表项 - 紧凑垂直排列 -->
  <rect x="8" y="30" width="184" height="22" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>
  <rect x="8" y="58" width="184" height="22" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>
  <rect x="8" y="86" width="184" height="22" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>
  <rect x="8" y="114" width="184" height="22" fill="#ffffff" stroke="rgba(0, 0, 0, 0.1)" stroke-width="0.5" rx="4"/>

  <!-- 头像圆点 -->
  <circle cx="18" cy="41" r="5" fill="#c9432f"/>
  <circle cx="18" cy="69" r="5" fill="#2d6c68"/>
  <circle cx="18" cy="97" r="5" fill="#b9832d"/>
  <circle cx="18" cy="125" r="5" fill="#425184"/>

  <!-- 文本线 -->
  <rect x="30" y="37" width="80" height="2" fill="rgba(0, 0, 0, 0.7)" rx="1"/>
  <rect x="30" y="43" width="50" height="1.5" fill="rgba(0, 0, 0, 0.5)" rx="0.75"/>
  <rect x="30" y="65" width="80" height="2" fill="rgba(0, 0, 0, 0.7)" rx="1"/>
  <rect x="30" y="71" width="50" height="1.5" fill="rgba(0, 0, 0, 0.5)" rx="0.75"/>
  <rect x="30" y="93" width="80" height="2" fill="rgba(0, 0, 0, 0.7)" rx="1"/>
  <rect x="30" y="99" width="50" height="1.5" fill="rgba(0, 0, 0, 0.5)" rx="0.75"/>
  <rect x="30" y="121" width="80" height="2" fill="rgba(0, 0, 0, 0.7)" rx="1"/>
  <rect x="30" y="127" width="50" height="1.5" fill="rgba(0, 0, 0, 0.5)" rx="0.75"/>

  <!-- 右侧操作按钮 -->
  <circle cx="176" cy="41" r="3" fill="rgba(0, 0, 0, 0.2)"/>
  <circle cx="176" cy="69" r="3" fill="rgba(0, 0, 0, 0.2)"/>
  <circle cx="176" cy="97" r="3" fill="rgba(0, 0, 0, 0.2)"/>
  <circle cx="176" cy="125" r="3" fill="rgba(0, 0, 0, 0.2)"/>

  <!-- 标签 -->
  <text x="100" y="12" fill="#2f2723" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">列表视图</text>
</svg>
