# 哪吒家庭 - 生产环境 Docker Compose 配置
# 用途：VPS/NAS 生产部署
# 启动：docker-compose -f docker-compose.prod.yml up -d
# 停止：docker-compose -f docker-compose.prod.yml down

services:
    # PostgreSQL 数据库
    postgres:
        image: postgres:16-alpine
        container_name: nezha-postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-nezha_family}
            POSTGRES_USER: ${POSTGRES_USER:-nezha_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env文件中设置POSTGRES_PASSWORD}
            POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - nezha-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nezha_user} -d ${POSTGRES_DB:-nezha_family}"]
            interval: 30s
            timeout: 10s
            retries: 5
        restart: always
        # 生产环境不暴露端口到宿主机
        expose:
            - "5432"

    # Redis 缓存和任务队列
    redis:
        image: redis:7-alpine
        container_name: nezha-redis
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?请在.env文件中设置REDIS_PASSWORD}
        volumes:
            - redis_data:/data
        networks:
            - nezha-network
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 30s
            timeout: 5s
            retries: 5
        restart: always
        expose:
            - "6379"

    # 数据库迁移（后端与 worker 都等待迁移完成后再启动）
    migrate:
        build:
            context: ./backend
            dockerfile: ../docker/Dockerfile.backend
            target: production
        container_name: nezha-migrate
        environment:
            DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nezha_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nezha_family}
            SECRET_KEY: ${SECRET_KEY:?请在.env文件中设置SECRET_KEY}
            ALGORITHM: HS256
            DEBUG: "false"
            ENVIRONMENT: production
        networks:
            - nezha-network
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"
        command: alembic upgrade head

    # 初始化可写存储卷权限，避免 named volume 默认 root:root 导致上传/备份失败
    storage-permissions:
        image: alpine:3.20
        container_name: nezha-storage-permissions
        user: "0:0"
        volumes:
            - media_files:/app/media
            - backup_files:/app/backups
            - ./logs/backend:/app/logs/backend
            - ./logs/celery:/app/logs/celery
        restart: "no"
        command: >
            sh -c "mkdir -p /app/media /app/backups /app/logs/backend /app/logs/celery &&
            chown -R 1000:1000 /app/media /app/backups /app/logs &&
            chmod -R u+rwX,g+rwX /app/media /app/backups /app/logs"

    # FastAPI 后端服务
    backend:
        build:
            context: ./backend
            dockerfile: ../docker/Dockerfile.backend
            target: production
        container_name: nezha-backend
        environment:
            # 数据库配置
            DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nezha_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nezha_family}
            # Redis 配置
            REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
            # JWT 配置
            SECRET_KEY: ${SECRET_KEY:?请在.env文件中设置SECRET_KEY}
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
            # 应用配置
            DEBUG: "false"
            ENVIRONMENT: production
            TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?请在.env文件中设置ALLOWED_ORIGINS}
            # 文件存储配置
            MEDIA_ROOT: /app/media
            MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-104857600}
            # AI 管家配置（默认关闭，可在后台管理页启用）
            AI_API_KEY: ${AI_API_KEY:-}
            AI_DEFAULT_BASE_URL: ${AI_DEFAULT_BASE_URL:-https://api.openai.com/v1}
            AI_DEFAULT_TEXT_MODEL: ${AI_DEFAULT_TEXT_MODEL:-gpt-4o-mini}
            AI_DEFAULT_VISION_MODEL: ${AI_DEFAULT_VISION_MODEL:-}
            AI_ENABLED: ${AI_ENABLED:-false}
            AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
            AI_FAILURE_THRESHOLD: ${AI_FAILURE_THRESHOLD:-3}
            # Celery 配置
            CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
            CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
            CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-600}
            CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-540}
            CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
            CELERY_IMAGE_TASK_TIME_LIMIT: ${CELERY_IMAGE_TASK_TIME_LIMIT:-600}
            CELERY_IMAGE_TASK_SOFT_TIME_LIMIT: ${CELERY_IMAGE_TASK_SOFT_TIME_LIMIT:-540}
            CELERY_AI_TASK_TIME_LIMIT: ${CELERY_AI_TASK_TIME_LIMIT:-180}
            CELERY_AI_TASK_SOFT_TIME_LIMIT: ${CELERY_AI_TASK_SOFT_TIME_LIMIT:-150}
        volumes:
            - media_files:/app/media
            - backup_files:/app/backups
            - ./logs/backend:/app/logs
        networks:
            - nezha-network
        depends_on:
            migrate:
                condition: service_completed_successfully
            storage-permissions:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 60s
        restart: always
        expose:
            - "8000"
        # 生产环境使用 gunicorn + uvicorn worker
        command: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 120 --keep-alive 5

    # Celery Worker (异步任务处理)
    celery-worker:
        build:
            context: ./backend
            dockerfile: ../docker/Dockerfile.backend
            target: production
        container_name: nezha-celery-worker
        environment:
            DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nezha_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nezha_family}
            REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
            SECRET_KEY: ${SECRET_KEY:?请在.env文件中设置SECRET_KEY}
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
            CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
            CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
            MEDIA_ROOT: /app/media
            DEBUG: "false"
            ENVIRONMENT: production
            TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
            AI_API_KEY: ${AI_API_KEY:-}
            AI_DEFAULT_BASE_URL: ${AI_DEFAULT_BASE_URL:-https://api.openai.com/v1}
            AI_DEFAULT_TEXT_MODEL: ${AI_DEFAULT_TEXT_MODEL:-gpt-4o-mini}
            AI_DEFAULT_VISION_MODEL: ${AI_DEFAULT_VISION_MODEL:-}
            AI_ENABLED: ${AI_ENABLED:-false}
            AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
            AI_FAILURE_THRESHOLD: ${AI_FAILURE_THRESHOLD:-3}
            CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-600}
            CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-540}
            CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
            CELERY_IMAGE_TASK_TIME_LIMIT: ${CELERY_IMAGE_TASK_TIME_LIMIT:-600}
            CELERY_IMAGE_TASK_SOFT_TIME_LIMIT: ${CELERY_IMAGE_TASK_SOFT_TIME_LIMIT:-540}
            CELERY_AI_TASK_TIME_LIMIT: ${CELERY_AI_TASK_TIME_LIMIT:-180}
            CELERY_AI_TASK_SOFT_TIME_LIMIT: ${CELERY_AI_TASK_SOFT_TIME_LIMIT:-150}
        volumes:
            - media_files:/app/media
            - ./logs/celery:/app/logs
        networks:
            - nezha-network
        depends_on:
            migrate:
                condition: service_completed_successfully
            storage-permissions:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        restart: always
        # 生产环境使用更多并发
        command: celery -A app.tasks.celery_app worker --loglevel=warning --concurrency=4 --max-tasks-per-child=1000

    # Vue 3 前端静态文件服务
    frontend:
        build:
            context: ./frontend
            dockerfile: ../docker/Dockerfile.frontend
            target: production
        container_name: nezha-frontend
        networks:
            - nezha-network
        restart: always
        expose:
            - "80"

    # Caddy 反向代理 (自动 HTTPS)
    caddy:
        image: caddy:2.7-alpine
        container_name: nezha-caddy
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"  # HTTP/3 支持
        environment:
            DOMAIN: ${DOMAIN:?请在.env文件中设置DOMAIN}
            EMAIL: ${ADMIN_EMAIL:?请在.env文件中设置ADMIN_EMAIL}
        volumes:
            - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - nezha-network
        depends_on:
            - backend
            - frontend
        restart: always

# 数据卷定义
volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
    media_files:
        driver: local
        # 可选：映射到宿主机路径便于备份
        # driver_opts:
        #   type: none
        #   o: bind
        #   device: /path/to/host/media
    backup_files:
        driver: local
        # 可选：映射到宿主机路径便于长期保留备份
        # driver_opts:
        #   type: none
        #   o: bind
        #   device: /path/to/host/backups
    caddy_data:
        driver: local
    caddy_config:
        driver: local

# 网络定义
networks:
    nezha-network:
        driver: bridge
